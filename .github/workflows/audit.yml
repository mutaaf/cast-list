# The audit runs in the Worker now: Cue wakes it when a listing surface's repo is pushed (after the deploy
# is live) and once a day as a safety net. Nothing here is on a timer. This job stays for running it by hand.
name: Audit
on:
  workflow_dispatch:
concurrency:
  group: audit
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/drift.mjs --post
        env:
          DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN }}
          LABS_SOURCE: ${{ secrets.LABS_SOURCE }}
