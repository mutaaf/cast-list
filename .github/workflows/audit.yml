# The audit: every six hours, and whenever the catalog changes, read every place that lists the apps,
# compare it with the catalog and post the report to mutaafaziz.com/cast. A change in what's wrong is
# published to Cue as cast.drift.changed. The audit never edits another repo: it reports.
name: Audit
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['catalog/**', 'src/**']
  workflow_dispatch:
concurrency:
  group: audit
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/drift.mjs --post
        env:
          DRIFT_TOKEN: ${{ secrets.DRIFT_TOKEN }}
          LABS_SOURCE: ${{ secrets.LABS_SOURCE }}
